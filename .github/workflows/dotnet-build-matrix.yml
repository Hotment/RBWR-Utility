name: Build & Package Avalonia C# App (.NET Multi-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (optional: leave empty to build & upload CI artifacts only)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore RbwrOverlay/RbwrOverlay.slnx

      - name: Build solution
        run: dotnet build RbwrOverlay/RbwrOverlay.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test RbwrOverlay/RbwrOverlay.Tests/RbwrOverlay.Tests.csproj -c Release --no-build --verbosity normal

  publish-windows:
    name: Publish Windows (${{ matrix.rid }})
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File Executable
        run: |
          dotnet publish RbwrOverlay/RbwrOverlay.UI/RbwrOverlay.UI.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/${{ matrix.rid }}

      - name: Prepare Windows Release Package
        run: |
          Copy-Item "publish/${{ matrix.rid }}/RbwrOverlay.exe" "RBWR_APRM_Calculator_${{ matrix.rid }}.exe"

          $bundleDir = "RBWR_APRM_Calculator_Windows_${{ matrix.rid }}"
          New-Item -ItemType Directory -Path $bundleDir -Force
          Copy-Item "publish/${{ matrix.rid }}/RbwrOverlay.exe" "$bundleDir/RbwrOverlay.exe"
          Copy-Item "publish/${{ matrix.rid }}/RbwrOverlay.exe" "$bundleDir/RBWR_APRM_Calculator.exe"
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" "$bundleDir/" }
          if (Test-Path "icon.png") { Copy-Item "icon.png" "$bundleDir/" }

          Compress-Archive -Path "$bundleDir/*" -DestinationPath "${bundleDir}.zip"

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: RBWR_APRM_Calculator_${{ matrix.rid }}_exe
          path: RBWR_APRM_Calculator_${{ matrix.rid }}.exe

      - name: Upload Windows Zip Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RBWR_APRM_Calculator_Windows_${{ matrix.rid }}
          path: RBWR_APRM_Calculator_Windows_${{ matrix.rid }}.zip

  publish-linux:
    name: Publish Linux (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Linux Standalone Binary
        run: |
          dotnet publish RbwrOverlay/RbwrOverlay.UI/RbwrOverlay.UI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/${{ matrix.rid }}

      - name: Package Linux Bundle (tar.gz & zip)
        run: |
          BUNDLE_NAME="RBWR_APRM_Calculator_Linux_${{ matrix.rid }}"
          mkdir -p "${BUNDLE_NAME}"
          cp -r publish/${{ matrix.rid }}/* "${BUNDLE_NAME}/"
          
          chmod +x "${BUNDLE_NAME}/RbwrOverlay"
          cp "${BUNDLE_NAME}/RbwrOverlay" "${BUNDLE_NAME}/RBWR_APRM_Calculator"
          
          if [ -f "icon.png" ]; then cp "icon.png" "${BUNDLE_NAME}/"; fi
          if [ -f "icon.ico" ]; then cp "icon.ico" "${BUNDLE_NAME}/"; fi

          cat << 'EOF' > "${BUNDLE_NAME}/run.sh"
          #!/usr/bin/env bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}:${LD_LIBRARY_PATH}"
          chmod +x "${SCRIPT_DIR}/RbwrOverlay" 2>/dev/null
          exec "${SCRIPT_DIR}/RbwrOverlay" "$@"
          EOF
          chmod +x "${BUNDLE_NAME}/run.sh"

          cat << 'EOF' > "${BUNDLE_NAME}/rbwr-overlay.desktop"
          [Desktop Entry]
          Name=RBWR APRM Calculator
          Comment=Realistic Boiling Water Reactor Transparent APRM & Thermal Calculator
          Exec=sh -c '"$(dirname "%k")/run.sh"'
          Icon=icon.png
          Terminal=false
          Type=Application
          Categories=Utility;Game;
          EOF
          chmod +x "${BUNDLE_NAME}/rbwr-overlay.desktop"

          tar -czvf "${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}"
          zip -r "${BUNDLE_NAME}.zip" "${BUNDLE_NAME}"

          cp "${BUNDLE_NAME}/RbwrOverlay" "RbwrOverlay_${{ matrix.rid }}"
          chmod +x "RbwrOverlay_${{ matrix.rid }}"

      - name: Upload Linux Package (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: RBWR_APRM_Calculator_Linux_${{ matrix.rid }}_targz
          path: RBWR_APRM_Calculator_Linux_${{ matrix.rid }}.tar.gz

      - name: Upload Linux Package (zip)
        uses: actions/upload-artifact@v4
        with:
          name: RBWR_APRM_Calculator_Linux_${{ matrix.rid }}_zip
          path: RBWR_APRM_Calculator_Linux_${{ matrix.rid }}.zip

      - name: Upload Linux Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: RbwrOverlay_${{ matrix.rid }}_binary
          path: RbwrOverlay_${{ matrix.rid }}

      - name: Build Linux AppImage (x86_64)
        if: matrix.rid == 'linux-x64'
        run: |
          APPDIR="RBWR_APRM_Calculator.AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/lib"

          cp -r publish/linux-x64/* "${APPDIR}/usr/bin/"
          APP_VER="2.1.1"
          if [ -f "RbwrOverlay/RbwrOverlay.UI/ViewModels/MainOverlayViewModel.cs" ]; then
            DETECTED=$(grep -oP 'public const string AppVersion = "\K[^"]+' "RbwrOverlay/RbwrOverlay.UI/ViewModels/MainOverlayViewModel.cs" 2>/dev/null || true)
            if [ -n "${DETECTED}" ]; then
              APP_VER="${DETECTED}"
            fi
          fi

          cat << EOF > "${APPDIR}/rbwr-overlay.desktop"
          [Desktop Entry]
          Name=RBWR APRM Calculator
          GenericName=Reactor Overlay
          Comment=Realistic Boiling Water Reactor Transparent APRM & Thermal Calculator
          Version=${APP_VER}
          Exec=RbwrOverlay
          Icon=icon
          Terminal=false
          Type=Application
          Categories=Utility;Game;
          X-AppImage-Version=${APP_VER}
          EOF

          if [ -f "icon.png" ]; then
            cp icon.png "${APPDIR}/icon.png"
            cp icon.png "${APPDIR}/rbwr-overlay.png"
            mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
            cp icon.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/rbwr-overlay.png"
          fi

          cat << 'EOF' > "${APPDIR}/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/RbwrOverlay" "$@"
          EOF
          chmod +x "${APPDIR}/AppRun"

          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null 2>&1

          ARCH=x86_64 ./squashfs-root/AppRun "${APPDIR}" "RBWR_APRM_Calculator_linux-x64.AppImage"
          chmod +x "RBWR_APRM_Calculator_linux-x64.AppImage"

      - name: Upload Linux AppImage
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: RBWR_APRM_Calculator_linux-x64_AppImage
          path: RBWR_APRM_Calculator_linux-x64.AppImage

  publish-macos:
    name: Publish macOS (${{ matrix.rid }})
    needs: test
    runs-on: macos-14
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate macOS Application Icon (.icns)
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p icon.iconset
            sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
            sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
            sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
            sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
            sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
            sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
            iconutil -c icns icon.iconset -o icon.icns
            rm -rf icon.iconset
          fi

      - name: Publish macOS Standalone Binary
        run: |
          dotnet publish RbwrOverlay/RbwrOverlay.UI/RbwrOverlay.UI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/${{ matrix.rid }}

      - name: Build macOS Application Bundle (.app)
        run: |
          BUNDLE_NAME="RBWR_APRM_Calculator_macOS_${{ matrix.rid }}"
          APP_NAME="RBWR APRM Calculator.app"
          mkdir -p "${BUNDLE_NAME}/${APP_NAME}/Contents/MacOS"
          mkdir -p "${BUNDLE_NAME}/${APP_NAME}/Contents/Resources"

          cp -r publish/${{ matrix.rid }}/* "${BUNDLE_NAME}/${APP_NAME}/Contents/MacOS/"
          chmod +x "${BUNDLE_NAME}/${APP_NAME}/Contents/MacOS/RbwrOverlay"

          if [ -f "icon.icns" ]; then
            cp icon.icns "${BUNDLE_NAME}/${APP_NAME}/Contents/Resources/icon.icns"
          fi
          if [ -f "icon.png" ]; then
            cp icon.png "${BUNDLE_NAME}/${APP_NAME}/Contents/Resources/icon.png"
          fi

          APP_VER="2.1.1"
          if [ -f "RbwrOverlay/RbwrOverlay.UI/ViewModels/MainOverlayViewModel.cs" ]; then
            DETECTED=$(grep -oP 'public const string AppVersion = "\K[^"]+' "RbwrOverlay/RbwrOverlay.UI/ViewModels/MainOverlayViewModel.cs" 2>/dev/null || true)
            if [ -n "${DETECTED}" ]; then
              APP_VER="${DETECTED}"
            fi
          fi
          NUM_VER=$(echo "${APP_VER}" | cut -d'-' -f1)

          cat << EOF > "${BUNDLE_NAME}/${APP_NAME}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>RBWR APRM Calculator</string>
              <key>CFBundleDisplayName</key>
              <string>RBWR APRM Calculator</string>
              <key>CFBundleIdentifier</key>
              <string>com.hotment.rbwroverlay</string>
              <key>CFBundleVersion</key>
              <string>${NUM_VER}.0</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VER}</string>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright © 2026 Hotment</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleExecutable</key>
              <string>RbwrOverlay</string>
              <key>CFBundleIconFile</key>
              <string>icon.icns</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep -s - "${BUNDLE_NAME}/${APP_NAME}" || true

          cp "${BUNDLE_NAME}/${APP_NAME}/Contents/MacOS/RbwrOverlay" "${BUNDLE_NAME}/RbwrOverlay"
          chmod +x "${BUNDLE_NAME}/RbwrOverlay"

          cat << 'EOF' > "${BUNDLE_NAME}/run.command"
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          chmod +x "${DIR}/RBWR APRM Calculator.app/Contents/MacOS/RbwrOverlay" 2>/dev/null
          exec "${DIR}/RBWR APRM Calculator.app/Contents/MacOS/RbwrOverlay" "$@"
          EOF
          chmod +x "${BUNDLE_NAME}/run.command"

          zip -r "${BUNDLE_NAME}.zip" "${BUNDLE_NAME}"

      - name: Upload macOS Package (zip)
        uses: actions/upload-artifact@v4
        with:
          name: RBWR_APRM_Calculator_macOS_${{ matrix.rid }}
          path: RBWR_APRM_Calculator_macOS_${{ matrix.rid }}.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: [publish-windows, publish-linux, publish-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Consolidate Release Assets
        run: |
          mkdir -p release-assets
          find release-downloads -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.AppImage" -o -name "RbwrOverlay_*" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true