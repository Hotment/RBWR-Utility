name: Cross-Platform Test (Linux & macOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'rbwr_overlay.py'
      - 'verify_calculations.py'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'rbwr_overlay.py'
      - 'verify_calculations.py'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system GUI dependencies (Tkinter & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Calculations Verification
        run: |
          python verify_calculations.py

      - name: Verify Module Import & Platform Compatibility (Headless Xvfb)
        run: |
          xvfb-run -a python -c "import rbwr_overlay; print('rbwr_overlay module initialized successfully on Linux')"

  test-macos:
    name: macOS Test (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Calculations Verification
        run: |
          python verify_calculations.py

      - name: Verify Module Import & Platform Compatibility
        run: |
          python -c "import rbwr_overlay; print('rbwr_overlay module initialized successfully on macOS')"