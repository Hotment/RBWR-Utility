name: Cross-Platform Test (Linux & macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system GUI dependencies (Tkinter & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Calculations Verification
        run: |
          python verify_calculations.py

      - name: Verify Module Import & Platform Compatibility (Headless Xvfb)
        run: |
          xvfb-run -a python -c "import rbwr_overlay; print('rbwr_overlay module initialized successfully on Linux')"

  test-macos:
    name: macOS Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon (arm64)
            os: macos-14
            arch: arm64
          - name: Intel (x86_64)
            os: macos-13
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Calculations Verification
        run: |
          python verify_calculations.py

      - name: Verify Module Import & Platform Compatibility
        run: |
          python -c "import rbwr_overlay; print('rbwr_overlay module initialized successfully on macOS')"
