name: Build macOS Release (.app)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS Universal App (Apple Silicon & Intel)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (with Tkinter & Tcl)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate macOS Application Icon (.icns)
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset

      - name: Build Universal2 macOS App Bundle
        run: |
          pyinstaller \
            --noconsole \
            --windowed \
            --target-arch universal2 \
            --icon=icon.icns \
            --name="RBWR APRM Calculator" \
            --add-data "icon.png:." \
            rbwr_overlay.py

      - name: Code Sign and Package
        run: |
          codesign --force --deep -s - "dist/RBWR APRM Calculator.app"
          cd dist
          zip -r -y "../RBWR_APRM_Calculator_macOS_Universal.zip" "RBWR APRM Calculator.app"
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBWR_APRM_Calculator_macOS_Universal
          path: "RBWR_APRM_Calculator_macOS_Universal.zip"