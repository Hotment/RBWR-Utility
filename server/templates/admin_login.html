<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RBWR APRM Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        background: '#0a0a0c',
                        surface: '#121217',
                        surfaceElevated: '#1a1a21',
                        border: 'rgba(255, 255, 255, 0.08)',
                        borderHover: 'rgba(255, 255, 255, 0.15)',
                        primary: '#3b82f6',
                        discord: '#5865F2',
                    }
                }
            }
        }
    </script>
    <style>
        html {
            scrollbar-gutter: stable;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0a0a0c;
            color: #f3f4f6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .premium-glass {
            background: #121217;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(16px);
        }

        .input-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-container:focus-within {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-4 sm:p-6 select-none font-sans max-w-full overflow-x-hidden">

    <div class="max-w-md w-full flex flex-col gap-6 relative">

        <div class="absolute -inset-10 bg-[#5865F2]/10 blur-3xl rounded-full opacity-35 -z-10"></div>

        <div class="text-center flex flex-col items-center gap-2">
            <div class="relative w-24 h-24 mb-2 flex items-center justify-center">
                <div
                    class="absolute inset-0 rounded-full border-2 border-dashed border-[#5865F2] animate-[spin_25s_linear_infinite] opacity-60">
                </div>
                <div class="absolute inset-3 rounded-full border border-[#5865F2]/30 animate-ping opacity-45"></div>
                <div
                    class="w-14 h-14 rounded-full bg-[#5865F2]/20 border border-[#5865F2]/50 flex items-center justify-center backdrop-blur-md shadow-[0_0_20px_rgba(88,101,242,0.3)]">
                    <svg class="w-7 h-7 text-[#5865F2] fill-current" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
                    </svg>
                </div>
            </div>

            <h1
                class="font-display font-semibold text-3xl tracking-wide text-white uppercase select-none whitespace-nowrap">
                Admin Portal</h1>
            <span class="text-[10px] text-slate-500 font-mono tracking-[0.25em] block whitespace-nowrap">// RBWR
                UTILITY SECURITY //</span>
        </div>

        <div class="premium-glass p-5 sm:p-8 rounded-2xl flex flex-col gap-6">
            <div class="border-b border-white/5 pb-4">
                <h2 class="text-sm font-semibold tracking-wide text-white font-display uppercase whitespace-nowrap">
                    Discord Authentication
                </h2>
                <p class="text-xs text-slate-400 font-mono mt-1.5 leading-relaxed">
                    Administrators are required to authenticate with an authorized Discord account.
                </p>
            </div>

            {% if error %}
            <div
                class="relative overflow-hidden rounded-xl bg-rose-950/30 border border-rose-500/30 p-4 shadow-[0_0_15px_rgba(244,63,94,0.08)] flex gap-3.5 items-start">
                <div class="absolute top-0 left-0 bottom-0 w-1 bg-rose-500"></div>
                <svg class="w-5 h-5 text-rose-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
                <div class="flex flex-col gap-0.5">
                    <span class="text-[10px] font-mono font-bold text-rose-500 tracking-widest">AUTHENTICATION
                        FAILED</span>
                    <p class="text-xs text-slate-200 font-mono leading-relaxed">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <div class="flex flex-col gap-4">
                <a href="{{ discord_login_url }}"
                    class="relative group overflow-hidden px-6 py-4 bg-[#5865F2] hover:bg-[#4752C4] text-white font-medium rounded-xl transition duration-200 text-sm tracking-wide font-mono shadow-lg shadow-[#5865F2]/25 flex items-center justify-center gap-3">
                    <svg class="w-5 h-5 fill-current shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
                    </svg>
                    <span>LOG IN WITH DISCORD</span>
                </a>
            </div>

            <div class="border-t border-white/5 pt-4">
                <button type="button" onclick="toggleLegacyLogin()"
                    class="text-[11px] text-slate-500 hover:text-slate-400 font-mono flex items-center justify-between w-full transition">
                    <span>Legacy Server Key Fallback</span>
                    <span id="legacy-toggle-icon">&plus;</span>
                </button>

                <div id="legacy-login-container" class="hidden mt-4 pt-2">
                    <form action="/admin/login" method="POST" class="flex flex-col gap-4">
                        <input type="hidden" name="next" value="{{ next_url or '/admin' }}">

                        <div class="flex flex-col gap-1.5">
                            <label for="username"
                                class="text-[10px] font-mono font-bold text-slate-400 tracking-wider">USERNAME</label>
                            <input type="text" id="username" name="username" placeholder="username"
                                class="premium-input px-3.5 py-2.5 rounded-xl text-xs font-mono outline-none">
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label for="password"
                                class="text-[10px] font-mono font-bold text-slate-400 tracking-wider">PASSWORD</label>
                            <input type="password" id="password" name="password" placeholder="password"
                                class="premium-input px-3.5 py-2.5 rounded-xl text-xs font-mono outline-none">
                        </div>

                        <button type="submit"
                            class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-slate-300 hover:text-white rounded-xl text-xs font-mono font-semibold transition mt-1">
                            Verify Legacy Credentials
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="text-center flex justify-center items-center gap-4 text-xs font-mono text-slate-500">
            <a href="/" class="hover:text-slate-300 transition hover:underline whitespace-nowrap">Return to Homepage</a>
        </div>

    </div>

    <script>
        function toggleLegacyLogin() {
            const container = document.getElementById('legacy-login-container');
            const icon = document.getElementById('legacy-toggle-icon');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.innerHTML = '&minus;';
            } else {
                container.classList.add('hidden');
                icon.innerHTML = '&plus;';
            }
        }
    </script>
</body>

</html>
